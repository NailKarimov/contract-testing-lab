name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write # publish the Allure report to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5 # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Start the private Petstore (Docker)
        run: npm run petstore:up

      - name: Lint and type check
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          # A missing Petstore container must fail the run, not skip its tests.
          REQUIRE_STACK: '1'
        run: npm test

      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git worktree add gh-pages-old origin/gh-pages || exit 0
          if [ -d gh-pages-old/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-old/history/. allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Keep other reports and add the visual guides to GitHub Pages
        if: always()
        run: |
          for d in fuzz contract; do if [ -d gh-pages-old/$d ]; then cp -r gh-pages-old/$d allure-report/$d; fi; done
          cp docs/schemathesis.html docs/contract-drift.html docs/pact.html allure-report/
          if ls pacts/*.json >/dev/null 2>&1; then mkdir -p allure-report/pact && cp pacts/*.json allure-report/pact/; fi
          true

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Stop the Petstore
        if: always()
        run: npm run petstore:down

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
